schema_version: 0.1.0
description: >
  Exact Z.1/FRED quarterly Treasury-security transaction components for
  holder-absorption reconciliation. FRED FU series are quarterly transaction
  flows in millions of dollars, not seasonally adjusted; project outputs use
  billions of dollars.

defaults:
  frequency: quarterly
  units_in: millions_usd
  units_out: billions_usd
  transform: divide_by_1000
  series_type: transaction_flow
  source: FRED Z.1

anchors:
  all_sectors:
    fred_id: BOGZ1FU893061105Q
    fof_code: FU893061105.Q
    output_column: exact_all_holder_transactions_bn
    description: All sectors; Treasury securities; asset, transactions.
  issuer_marketable:
    fred_id: BOGZ1FU313161105Q
    fof_code: FU313161105.Q
    output_column: issuer_marketable_treasury_liability_transactions_bn
    description: Federal government; total marketable Treasury securities; liability, transactions.

components:
  - key: monetary_authority_total_treasuries
    fred_id: BOGZ1FU713061103Q
    fof_code: FU713061103.Q
    bucket: fed
    description: Monetary authority; total Treasury securities; asset, transactions.

  - key: us_chartered_depositories_total_treasuries
    fred_id: BOGZ1FU763061100Q
    fof_code: FU763061100.Q
    bucket: banks
    description: U.S.-chartered depository institutions; Treasury securities; asset, transactions.

  - key: banks_us_affiliated_areas_total_treasuries
    fred_id: BOGZ1FU743061103Q
    fof_code: FU743061103.Q
    bucket: banks
    description: Banks in U.S.-affiliated areas; Treasury securities; asset, transactions.

  - key: foreign_banking_offices_us_total_treasuries
    fred_id: BOGZ1FU753061103Q
