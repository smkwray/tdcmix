[project]
name = "tdcmix"
version = "0.1.0"
description = "Holder-mix and issuance-composition tooling for TDC research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not integration'"
markers = ["integration: checks requiring the configured sibling source datasets"]

[tool.ruff.lint]
# Explicit correctness checks independent of Ruff version defaults.
select = ["E4", "E7", "E9", "F"]
